name: Deploy Frontend

# 수동 실행 전용
on:
  workflow_dispatch: {}

env:
  AWS_REGION: ap-northeast-2

permissions:
  id-token: write # OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      #임시 추가 이후 무조건 삭제 및 기록 삭제
      - name: Debug role
        run: |
          echo "${{ secrets.AWS_ROLE_ARN }}" | sed 's/./& /g'

      - name: Install & Build
        env:
          VITE_API_GATEWAY_URL: https://api.jubg.shop
          VITE_WS_GATEWAY_URL: wss://api.jubg.shop/ws/chat
        run: |
          yarn install --frozen-lockfile
          yarn build              # 결과물: dist/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 정적 자산은 길게 캐시, index.html은 캐시 안 함(새 배포 즉시 반영)
      - name: Upload to S3
        run: |
          aws s3 sync dist "s3://${{ secrets.FRONTEND_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html "s3://${{ secrets.FRONTEND_BUCKET }}/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CF_DISTRIBUTION_ID }}" \
            --paths "/*"
